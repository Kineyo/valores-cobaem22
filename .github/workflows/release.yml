name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de release (ej: v1.1, v1.2, v1.3)'
        required: false
        default: ''

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export-pc:
    name: Export PC (Linux & Windows)
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable ~/.local/share/godot/export_templates/ 2>/dev/null || cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true
          ls -la ~/.local/share/godot/export_templates/

      - name: Godot Headless Import
        run: |
          godot --headless --editor --quit || true

      - name: Run Headless Automated Integrity Tests
        run: |
          godot --headless -s tools/test_game.gd

      - name: Build Linux Executable
        run: |
          mkdir -v -p build/linux
          godot --headless --verbose --export-release "Linux/X11" build/linux/campeones_valores.x86_64

      - name: Build Windows Executable
        run: |
          mkdir -v -p build/windows
          godot --headless --verbose --export-release "Windows Desktop" build/windows/campeones_valores.exe

      - name: Package Binaries into ZIP
        run: |
          mkdir -v -p dist
          chmod +x build/linux/campeones_valores.x86_64
          cd build/linux && zip -r ../../dist/campeones_valores_linux_x86_64.zip . && cd ../..
          cd build/windows && zip -r ../../dist/campeones_valores_windows_x86_64.zip . && cd ../..
          ls -lh dist/

      - name: Upload PC Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pc-builds
          path: dist/
          retention-days: 1

  export-android:
    name: Export Android (APK)
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable ~/.local/share/godot/export_templates/ 2>/dev/null || cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true
          ls -la ~/.local/share/godot/export_templates/

      - name: Configure Android SDK & Keystore
        run: |
          mkdir -v -p ~/.config/godot
          if [ ! -f debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12 || true
          fi
          
          ANDROID_SDK_PATH="${ANDROID_HOME:-/usr/lib/android-sdk}"
          JAVA_PATH="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(which javac 2>/dev/null || which java 2>/dev/null || echo '/usr/bin/java')")")")}"
          
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\nexport/android/force_system_user = false\nexport/android/shutdown_adb_on_exit = true\n' "${ANDROID_SDK_PATH}" "${JAVA_PATH}" "$(pwd)" > ~/.config/godot/editor_settings-4.3.tres
          cp -v ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres 2>/dev/null || true
          cp -v ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.7.tres 2>/dev/null || true
          cp -v ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.7.2.tres 2>/dev/null || true
          cp -v ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.7.2.stable.tres 2>/dev/null || true
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Godot Headless Import
        run: |
          godot --headless --editor --quit || true

      - name: Build Android APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-release "Android" build/android/campeones_valores.apk || godot --headless --verbose --export-debug "Android" build/android/campeones_valores.apk
          ls -lh build/android/

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/android/campeones_valores.apk
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [export-pc, export-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PC Artifacts
        uses: actions/download-artifact@v4
        with:
          name: pc-builds
          path: release_assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: release_assets

      - name: Inspect Release Assets
        run: |
          ls -lh release_assets/

      - name: Determine Tag Name
        id: tag_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            VER=$(grep 'config/version=' project.godot | cut -d'"' -f2)
            echo "tag=v${VER:-1.3}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Campeones de los Valores ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release_assets/campeones_valores_linux_x86_64.zip
            release_assets/campeones_valores_windows_x86_64.zip
            release_assets/campeones_valores.apk
          body: |
            # 🎮 Campeones de los Valores — ${{ steps.tag_info.outputs.tag }}
            
            Versión oficial compilada y empaquetada automáticamente mediante GitHub Actions para **Linux**, **Windows** y **Android**.
            
            ---
            
            ### 📦 Paquetes Oficiales Listos para Descargar:
            - 🐧 **Linux (x86_64):** `campeones_valores_linux_x86_64.zip` — Ejecutable nativo compatible con Ubuntu, Debian, Fedora, Arch y derivados.
            - 🪟 **Windows (64-bit):** `campeones_valores_windows_x86_64.zip` — Ejecutable `.exe` independiente sin requerir dependencias externas.
            - 📱 **Android:** `campeones_valores.apk` — Instalador directo para celulares, tabletas y pantallas táctiles educativas.
            
            ---
            
            ### 🛠️ ¿Qué se reparó? (Corrección de Bugs y Errores):
            1. **Interacción con Ratón y Botones del Menú:** Se solucionó el bloqueo donde los botones del menú no respondían al clic del ratón y requerían obligatoriamente atajos de teclado (`<Esc>`), asegurando ahora compatibilidad fluida y unificada con ratón, gamepad y pantalla táctil.
            2. **Joystick Táctil sin Latigazo (*Lurching Fix*):** Al tocar la pantalla, el stick virtual se ancla dinámicamente en el punto de contacto y el vector analógico inicia en reposo neutral `(0, 0)`, eliminando tirones involuntarios del personaje.
            3. **Compatibilidad con Notches y Cámaras Frontales:** Se implementó `get_safe_insets_for_viewport` con `DisplayServer.get_display_safe_area()`, reubicando paneles superiores, botón de pausa y barras para que no queden ocultos tras muescas o esquinas redondeadas.
            4. **Secuencia del Modo Historia:** Se reparó la omisión del Acto I al iniciar el juego; ahora la cadena narrativa progresa fluidamente: `Prólogo -> Acto I -> Escenario 1 -> ... -> Acto VI -> Escenario 6 -> Epílogo -> Victoria`.
            5. **Fuga de Animaciones (Tweens) en Alumnos:** Se corrigió un error de cascada en `student.gd` donde se creaban múltiples tweens en cada frame de físicas, estabilizando los 60 FPS continuos en dispositivos de gama de entrada.
            6. **Llamadas Defensivas en Redención de Jefes:** Se blindaron los métodos de colisión y hitbox en `boss.gd` ante llamadas de cierre o recarga rápida, impidiendo excepciones de puntero nulo.
            7. **Ocultamiento Limpio de Barra de Jefe:** Se corrigió el desvanecimiento de la barra de vida en el HUD mediante `Tween.TWEEN_PAUSE_PROCESS` y cerrado inmediato al transicionar de escenario.
            8. **Pipeline de Compilación Android:** Se solventó el fallo en CI de `keytool` cuando `debug.keystore` ya está rastreado en el repositorio.
            
            ---
            
            ### ✨ ¿Qué se arregló y mejoró? (Novedades de la Versión v1.3):
            - **📖 Modo Historia Completo:** Incorporación de Prólogo, 6 Actos cinemáticos con diálogos institucionales, Epílogo y retratos pixel-art procedurales inspirados en el plantel **CEMSaD 22 ENTHAVI (Temoaya)** y la herencia cultural otomí.
            - **👹 Los 6 Jefes Finales con Redención Pacífica:**
              - *Nivel 1:* **Apatyx, el Espectro del Desgano** (Acceso y Laboratorio D).
              - *Nivel 2:* **Desperdicius, el Titán del Desperdicio** (Edificio A — Cafetería).
              - *Nivel 3:* **Superbus, el Heraldo de la Arrogancia** (Plaza Cívica y Escalinata Sur).
              - *Nivel 4:* **Ciber-Murmullus, el Espectro de la Difamación** (Edificio B — Biblioteca).
              - *Nivel 5:* **Plagiatrix, el Señor de la Falsedad** (Edificio C — Cómputo y Dirección).
              - *Nivel 6:* **Titanor, el Coloso del Bullying Escolar** (Cancha de Usos Múltiples).
              Todos con ataques telegrafiados ($\ge 0.8\text{ s}$ de anticipación) y filosofía formativa de redención sin violencia.
            - **🎓 Alumnos Secundarios COBAEM:** Mateo, Xóchitl, Emiliano y Sofía con uniformes escolares oficiales, diálogos de proximidad, estados de aflicción/alivio y curación de +1 corazón de esperanza al héroe herido.
            - **📱 Ergonomía Táctil Móvil:** Botones interactivos ampliados a $\ge 44\times 44\text{ dp}$, joystick analógico con guías sutiles en reposo y botón flotante de Virtud.
            - **🌐 Arquitectura Multiplataforma Optimizada:** Rendimiento garantizado para Linux, Windows y Android bajo el renderizador `gl_compatibility` y la escala real ($1\text{ m} = 40\text{ px}$).
            - **Banda Sonora y Efectos Chiptune:** Música y audio procedural sincronizados.
