name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de release (ej: v1.1, v1.2, v1.3)'
        required: false
        default: ''

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export-pc:
    name: Export PC (Linux & Windows)
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable ~/.local/share/godot/export_templates/ 2>/dev/null || cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true
          ls -la ~/.local/share/godot/export_templates/

      - name: Godot Headless Import
        run: |
          godot --headless --editor --quit || true

      - name: Run Headless Automated Integrity Tests
        run: |
          godot --headless -s tools/test_game.gd

      - name: Build Linux Executable
        run: |
          mkdir -v -p build/linux
          godot --headless --verbose --export-release "Linux/X11" build/linux/campeones_valores.x86_64

      - name: Build Windows Executable
        run: |
          mkdir -v -p build/windows
          godot --headless --verbose --export-release "Windows Desktop" build/windows/campeones_valores.exe

      - name: Package Binaries into ZIP
        run: |
          mkdir -v -p dist
          chmod +x build/linux/campeones_valores.x86_64
          cd build/linux && zip -r ../../dist/campeones_valores_linux_x86_64.zip . && cd ../..
          cd build/windows && zip -r ../../dist/campeones_valores_windows_x86_64.zip . && cd ../..
          ls -lh dist/

      - name: Upload PC Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pc-builds
          path: dist/
          retention-days: 1

  export-android:
    name: Export Android (APK)
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable ~/.local/share/godot/export_templates/ 2>/dev/null || cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true
          ls -la ~/.local/share/godot/export_templates/

      - name: Configure Android SDK & Keystore
        run: |
          mkdir -v -p ~/.config/godot
          if [ ! -f debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12 || true
          fi
          
          KEYSTORE_FILE="$(pwd)/debug.keystore"
          sed -i "s|^keystore/debug=\"\"|keystore/debug=\"${KEYSTORE_FILE}\"|" export_presets.cfg
          sed -i 's|^keystore/debug_user=""|keystore/debug_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|^keystore/debug_password=""|keystore/debug_password="android"|' export_presets.cfg
          sed -i "s|^keystore/release=\"\"|keystore/release=\"${KEYSTORE_FILE}\"|" export_presets.cfg
          sed -i 's|^keystore/release_user=""|keystore/release_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|^keystore/release_password=""|keystore/release_password="android"|' export_presets.cfg
          
          ANDROID_SDK_PATH="${ANDROID_HOME:-/usr/lib/android-sdk}"
          JAVA_PATH="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(which javac 2>/dev/null || which java 2>/dev/null || echo '/usr/bin/java')")")")}"
          
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\nexport/android/force_system_user = false\nexport/android/shutdown_adb_on_exit = true\n' "${ANDROID_SDK_PATH}" "${JAVA_PATH}" "$(pwd)" > ~/.config/godot/editor_settings-4.3.tres
          cp -v ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres 2>/dev/null || true
          cp -v ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.7.tres 2>/dev/null || true
          cp -v ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.7.2.tres 2>/dev/null || true
          cp -v ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.7.2.stable.tres 2>/dev/null || true
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Godot Headless Import
        run: |
          godot --headless --editor --quit || true

      - name: Build Android APKs (Release and Debug)
        run: |
          mkdir -v -p build/android
          echo "=== Compilando APK Release ==="
          godot --headless --verbose --export-release "Android" build/android/campeones_valores_release.apk
          echo "=== Compilando APK Debug ==="
          godot --headless --verbose --export-debug "Android" build/android/campeones_valores_debug.apk
          # Copia estándar de release para descarga directa
          cp -v build/android/campeones_valores_release.apk build/android/campeones_valores.apk
          ls -lh build/android/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: build/android/*.apk
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [export-pc, export-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PC Artifacts
        uses: actions/download-artifact@v4
        with:
          name: pc-builds
          path: release_assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: release_assets

      - name: Inspect Release Assets
        run: |
          ls -lh release_assets/

      - name: Determine Tag Name
        id: tag_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            VER=$(grep 'config/version=' project.godot | cut -d'"' -f2)
            echo "tag=v${VER:-1.7}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Campeones de los Valores ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release_assets/campeones_valores_linux_x86_64.zip
            release_assets/campeones_valores_windows_x86_64.zip
            release_assets/campeones_valores.apk
            release_assets/campeones_valores_release.apk
            release_assets/campeones_valores_debug.apk
          body: |
            # 🎮 Campeones de los Valores — ${{ steps.tag_info.outputs.tag }}
            
            Versión oficial compilada y empaquetada automáticamente mediante GitHub Actions para **Linux**, **Windows** y **Android** (con variantes **Release** y **Debug**) bajo licencia de software libre **GNU GPL v3.0**.
            
            ---
            
            ### 📦 Paquetes Oficiales Listos para Descargar:
            - 🐧 **Linux (x86_64):** `campeones_valores_linux_x86_64.zip` — Ejecutable nativo compatible con Ubuntu, Debian, Fedora, Arch y derivados.
            - 🪟 **Windows (64-bit):** `campeones_valores_windows_x86_64.zip` — Ejecutable `.exe` independiente sin requerir dependencias externas.
            - 📱 **Android (Release Oficial):** `campeones_valores_release.apk` (y `campeones_valores.apk`) — Instalador firmado y optimizado para teléfonos y tabletas.
            - 🛠️ **Android (Debug / Pruebas):** `campeones_valores_debug.apk` — Instalador con símbolos y consola de depuración para auditoría y pruebas técnicas escolares.
            
            ---
            
            ### ✨ Novedades Principales de la Versión v1.7:
            1. **📜 Nueva Licencia de Software Libre Educativo (`GNU GPL v3.0`):**
               - Migración oficial a **GNU General Public License v3.0**, garantizando que el proyecto permanezca siempre como código abierto para estudiantes, docentes e instituciones educativas (*copyleft*) y resguardando las denominaciones y emblemas institucionales del **COBAEM CEMSaD 22 ENTHAVI**.
            2. **🗣️ Diálogos, Interfaz y Certificados Dinámicos por Género (`Masculino` / `Femenino`):**
               - Adaptación gramatical completa según el personaje elegido en el **Modo Historia** (Prólogo, los 6 Actos y Epílogo: *Guardián / Guardiana de los Valores*, concordancia de adjetivos y pronombres), frases de entrada de los **7 Jefes**, agradecimientos y frases de combate de los **7 alumnos secundarios**, subtítulo de pausa en el HUD, escena clímax (*Héroe / Heroína*) y **Ceremonia Final** (*alumno ejemplar / alumna ejemplar*, *nuestro / nuestra representante*).
               - Los certificados **PDF 1.4** descargables (**Tamaño Carta** y **5×7**, con opción de escribir tu nombre) adaptan automáticamente su redacción entre *«El alumno/Padre de familia/Maestro... asesor de los valores»* y *«La alumna/Madre de familia/Maestra... asesora de los valores»*.
            3. **🤝 Aliados con IA (`AllyBrain`), Pulso de Empatía e Inventario con `Esperanza` (15s):**
               - Los 7 estudiantes rescatados (*Mateo, María, Valeria, Fernanda, Diego, Sofía y Alejandro*) se unen activamente con 5 poses animadas estandarizadas a `512×512 px`, evasión inteligente de proyectiles y apoyo pacífico frente a jefes.
               - Nueva habilidad activa **Pulso de Empatía** (`[E]` / botón táctil `PULSO`) y ranura de inventario (`[Q]` / `ÍTEM`) con Corazón, Escudo y la estrella dorada **Esperanza**, que disipa la niebla, anula clones de sombra y deja indefenso a Titanor durante **15 segundos**.
            4. **🎵 Banda Sonora Dinámica (12 Temas), Vida Porcentual (`%`) y Clímax Estilo Undertale a 1 HP:**
               - Catálogo musical de **12 composiciones escolares/Touhou** con arreglos diferenciados entre personaje Masculino y Femenino y modulación dinámica por dificultad.
               - Indicadores de vida en porcentaje (`%`) con estados animados de daño, nuevos patrones Danmaku Touhou para Titanor y secuencia cinematográfica a **1 HP** donde el protagonista y los 7 aliados convergen como **8 Corazones de los Valores** al ritmo del tema *Finale*.
            5. **📚 Biblioteca de Materiales (`⋮`), Créditos 3:4 y Mejoras Multiplataforma:**
               - Nueva enciclopedia interactiva desde el menú principal (`⋮`) para explorar **Personajes**, **Jukebox musical**, **Escenarios**, **Enemigos/Jefes**, **Habilidades** y **Videos en pantalla completa**, además del botón **Créditos (3:4)**, selector de etapas desbloqueadas, récords por dificultad y ergonomía táctil antisolapamiento validada por **22 bloques de pruebas automatizadas**.
