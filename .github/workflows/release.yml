name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de release (ej: v1.1, v1.2, v1.3)'
        required: false
        default: ''

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export-pc:
    name: Export PC (Linux & Windows)
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable ~/.local/share/godot/export_templates/ 2>/dev/null || cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true
          ls -la ~/.local/share/godot/export_templates/

      - name: Godot Headless Import
        run: |
          godot --headless --editor --quit || true

      - name: Run Headless Automated Integrity Tests
        run: |
          godot --headless -s tools/test_game.gd

      - name: Build Linux Executable
        run: |
          mkdir -v -p build/linux
          godot --headless --verbose --export-release "Linux/X11" build/linux/campeones_valores.x86_64

      - name: Build Windows Executable
        run: |
          mkdir -v -p build/windows
          godot --headless --verbose --export-release "Windows Desktop" build/windows/campeones_valores.exe

      - name: Package Binaries into ZIP
        run: |
          mkdir -v -p dist
          chmod +x build/linux/campeones_valores.x86_64
          cd build/linux && zip -r ../../dist/campeones_valores_linux_x86_64.zip . && cd ../..
          cd build/windows && zip -r ../../dist/campeones_valores_windows_x86_64.zip . && cd ../..
          ls -lh dist/

      - name: Upload PC Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pc-builds
          path: dist/
          retention-days: 1

  export-android:
    name: Export Android (APK)
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable ~/.local/share/godot/export_templates/ 2>/dev/null || cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true
          ls -la ~/.local/share/godot/export_templates/

      - name: Configure Android SDK & Keystore
        run: |
          mkdir -v -p ~/.config/godot
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          
          ANDROID_SDK_PATH="${ANDROID_HOME:-/usr/lib/android-sdk}"
          JAVA_PATH="$(dirname "$(dirname "$(readlink -f "$(which javac || which java)")")")"
          
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\nexport/android/force_system_user = false\nexport/android/shutdown_adb_on_exit = true\n' "${ANDROID_SDK_PATH}" "${JAVA_PATH}" "$(pwd)" > ~/.config/godot/editor_settings-4.3.tres
          cp -v ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres 2>/dev/null || true
          cp -v ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.7.tres 2>/dev/null || true
          cp -v ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.7.2.tres 2>/dev/null || true
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Godot Headless Import
        run: |
          godot --headless --editor --quit || true

      - name: Build Android APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-release "Android" build/android/campeones_valores.apk || godot --headless --verbose --export-debug "Android" build/android/campeones_valores.apk
          ls -lh build/android/

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/android/campeones_valores.apk
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [export-pc, export-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PC Artifacts
        uses: actions/download-artifact@v4
        with:
          name: pc-builds
          path: release_assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: release_assets

      - name: Inspect Release Assets
        run: |
          ls -lh release_assets/

      - name: Determine Tag Name
        id: tag_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            VER=$(grep 'config/version=' project.godot | cut -d'"' -f2)
            echo "tag=v${VER:-1.3}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Campeones de los Valores ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release_assets/campeones_valores_linux_x86_64.zip
            release_assets/campeones_valores_windows_x86_64.zip
            release_assets/campeones_valores.apk
          body: |
            # 🎮 Campeones de los Valores — ${{ steps.tag_info.outputs.tag }}
            
            Versión oficial compilada y empaquetada automáticamente por GitHub Actions.
            
            ### 📦 Paquetes Listos para Descargar:
            - 🐧 **Linux (x86_64):** `campeones_valores_linux_x86_64.zip` (Ejecutable nativo para Ubuntu, Debian, Fedora, Arch y derivados)
            - 🪟 **Windows (64-bit):** `campeones_valores_windows_x86_64.zip` (Ejecutable `.exe` independiente)
            - 📱 **Android:** `campeones_valores.apk` (Instalador directo para celulares y tablets)
            
            ### 🏫 Novedades y Características de la Versión v1.3:
            - **📖 Modo Historia Completo:** Cinemáticas con diálogos, retratos procedurales pixel-art, Prólogo, 6 Actos y Epílogo basados en el plantel **CEMSaD 22 ENTHAVI (Temoaya)**.
            - **👹 Los 6 Jefes Finales:** Apatyx, Desperdicius, Superbus, Ciber-Murmullus, Plagiatrix y Titanor con ataques telegrafiados y filosofía de redención pacífica.
            - **🎓 Alumnos Secundarios COBAEM:** Personajes interactivos (Mateo, Xóchitl, Emiliano, Sofía) con estados de aflicción/felicidad y curación de esperanza.
            - **📱 Ergonomía Táctil Móvil y Safe Area:** Joysticks virtuales dinámicos con resting guides, compensación de muescas (notches) y botones adaptados a $\ge 44\times 44\text{ dp}$.
            - **🌐 Arquitectura Multiplataforma:** Armonización completa para Linux, Windows y Android bajo el renderizador `gl_compatibility` y escala real ($1\text{ m} = 40\text{ px}$).
            - **Visor CAD 2D y Maqueta 3D:** Herramientas interactivas integradas en HTML5 y Three.js.
            - **Audio Original:** Banda sonora chiptune y efectos sintetizados proceduralmente.
