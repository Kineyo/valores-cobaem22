name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de release (ej: v1.1, v1.2, v1.3)'
        required: false
        default: ''

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export-pc:
    name: Export PC (Linux & Windows)
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable ~/.local/share/godot/export_templates/ 2>/dev/null || cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true
          ls -la ~/.local/share/godot/export_templates/

      - name: Godot Headless Import
        run: |
          godot --headless --editor --quit || true

      - name: Run Headless Automated Integrity Tests
        run: |
          godot --headless -s tools/test_game.gd

      - name: Build Linux Executable
        run: |
          mkdir -v -p build/linux
          godot --headless --verbose --export-release "Linux/X11" build/linux/campeones_valores.x86_64

      - name: Build Windows Executable
        run: |
          mkdir -v -p build/windows
          godot --headless --verbose --export-release "Windows Desktop" build/windows/campeones_valores.exe

      - name: Package Binaries into ZIP
        run: |
          mkdir -v -p dist
          chmod +x build/linux/campeones_valores.x86_64
          cd build/linux && zip -r ../../dist/campeones_valores_linux_x86_64.zip . && cd ../..
          cd build/windows && zip -r ../../dist/campeones_valores_windows_x86_64.zip . && cd ../..
          ls -lh dist/

      - name: Upload PC Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pc-builds
          path: dist/
          retention-days: 1

  export-android:
    name: Export Android (APK)
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable ~/.local/share/godot/export_templates/ 2>/dev/null || cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true
          ls -la ~/.local/share/godot/export_templates/

      - name: Configure Android SDK & Keystore
        run: |
          mkdir -v -p ~/.config/godot
          if [ ! -f debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12 || true
          fi
          
          ANDROID_SDK_PATH="${ANDROID_HOME:-/usr/lib/android-sdk}"
          JAVA_PATH="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(which javac 2>/dev/null || which java 2>/dev/null || echo '/usr/bin/java')")")")}"
          
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\nexport/android/force_system_user = false\nexport/android/shutdown_adb_on_exit = true\n' "${ANDROID_SDK_PATH}" "${JAVA_PATH}" "$(pwd)" > ~/.config/godot/editor_settings-4.3.tres
          cp -v ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres 2>/dev/null || true
          cp -v ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.7.tres 2>/dev/null || true
          cp -v ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.7.2.tres 2>/dev/null || true
          cp -v ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.7.2.stable.tres 2>/dev/null || true
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Godot Headless Import
        run: |
          godot --headless --editor --quit || true

      - name: Build Android APKs (Release and Debug)
        run: |
          mkdir -v -p build/android
          echo "=== Compilando APK Release ==="
          godot --headless --verbose --export-release "Android" build/android/campeones_valores_release.apk
          echo "=== Compilando APK Debug ==="
          godot --headless --verbose --export-debug "Android" build/android/campeones_valores_debug.apk
          # Copia estándar de release para descarga directa
          cp -v build/android/campeones_valores_release.apk build/android/campeones_valores.apk
          ls -lh build/android/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: build/android/*.apk
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [export-pc, export-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PC Artifacts
        uses: actions/download-artifact@v4
        with:
          name: pc-builds
          path: release_assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: release_assets

      - name: Inspect Release Assets
        run: |
          ls -lh release_assets/

      - name: Determine Tag Name
        id: tag_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            VER=$(grep 'config/version=' project.godot | cut -d'"' -f2)
            echo "tag=v${VER:-1.4.0}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Campeones de los Valores ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release_assets/campeones_valores_linux_x86_64.zip
            release_assets/campeones_valores_windows_x86_64.zip
            release_assets/campeones_valores.apk
            release_assets/campeones_valores_release.apk
            release_assets/campeones_valores_debug.apk
          body: |
            # 🎮 Campeones de los Valores — ${{ steps.tag_info.outputs.tag }}
            
            Versión oficial compilada y empaquetada automáticamente mediante GitHub Actions para **Linux**, **Windows** y **Android** (con variantes **Release** y **Debug**).
            
            ---
            
            ### 📦 Paquetes Oficiales Listos para Descargar:
            - 🐧 **Linux (x86_64):** `campeones_valores_linux_x86_64.zip` — Ejecutable nativo compatible con Ubuntu, Debian, Fedora, Arch y derivados.
            - 🪟 **Windows (64-bit):** `campeones_valores_windows_x86_64.zip` — Ejecutable `.exe` independiente sin requerir dependencias externas.
            - 📱 **Android (Release Oficial):** `campeones_valores_release.apk` (y `campeones_valores.apk`) — Instalador de producción firmado y optimizado para máximo rendimiento.
            - 🛠️ **Android (Debug / Pruebas):** `campeones_valores_debug.apk` — Instalador con símbolos y consola de depuración activada para auditoría y pruebas técnicas en planteles educativos.
            
            ---
            
            ### ✨ Novedades Principales de la Versión v1.4.0:
            1. **🏫 Puertas de Acceso a Salones y Bloqueo Progresivo de Meta:**
               - Cada escenario exterior cuenta con la entrada interactiva a su salón de clases correspondiente.
               - Si el jugador intenta cruzar la meta exterior sin limpiar antes el salón, aparece la advertencia **`"Debemos limpiar los salones de antivalores antes de continuar"`**.
            2. **🌫️ Niebla del Desinterés y 6 Ataques Únicos por Maestro:**
               - Cada **Maestro Desinterés** posee un estilo de combate único según su salón: frascos químicos autodirigidos (Laboratorio), exámenes rebotantes (Aula 1), ondas expansivas cívicas (Sala Cívica), ráfagas de libros (Biblioteca), glitch digital en cruz (Taller de Cómputo) y balones deportivos con embestida (Aula Magna).
               - **Modo Fácil / Normal:** Si la batalla dura 1 minuto (60s) o más, la **Niebla del Desinterés** cubre el aula dejando luz únicamente alrededor del alumno y revelando al Maestro por sus **ojos rojos ardientes y corazón negro palpitante**.
               - **Modo Difícil:** La niebla está activa desde el inicio y aparecen **10 antivalores en oleadas de 3 en 3** antes del jefe final; al redimirlos a todos, la niebla se disipa.
            3. **🎨 Escenarios y Salones Enriquecidos con Sombras 3D e Iluminación:**
               - Rediseño visual de los 6 mapas exteriores y 6 salones interiores con sombras proyectadas, oclusión ambiental, haces de luz solar en ventanas y mobiliario detallado a escala real ($1\text{ m} = 40\text{ px}$).
            4. **🧑‍🎓 Selección de Protagonista (Masculino / Femenino 512×512) y Retratos HD:**
               - Menú principal a pantalla completa con logos institucionales COBAEM renovados y selector intermedio de aspecto (`Masculino` y `Femenino`).
               - Nuevos diseños y retratos de alta resolución para el **Guardián de los Valores** y los alumnos secundarios (**Mateo, María, Valeria, Fernanda, Sofía, Diego y Alejandro**).
